name: Test CHANGELOG Generator

on:
  push:
    branches: [main, bounty-1-changelog]
  pull_request:
    branches: [main]

jobs:
  test-bash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test bash script runs
        run: |
          bash generate_changelog.sh /tmp/test-changelog.md .
          test -f /tmp/test-changelog.md && echo "✅ CHANGELOG generated (bash)"
          head -20 /tmp/test-changelog.md

  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test Python script runs
        run: |
          python3 generate_changelog.py /tmp/test-changelog.md .
          test -f /tmp/test-changelog.md && echo "✅ CHANGELOG generated (Python)"
          head -20 /tmp/test-changelog.md
